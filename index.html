<!DOCTYPE html>
<html lang="tr"><!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oranmerkezi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00ffcc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #bbb; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #00ffcc; border: none; color: #000; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .result { margin-top: 20px; background: #2a2a2a; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Oranmerkezi</h2>
    
    <div class="form-group">
        <label>Ev Sahibi Takım:</label>
        <input type="text" id="homeTeam" placeholder="Örn: Beşiktaş">
    </div>

    <div class="form-group">
        <label>Deplasman Takım:</label>
        <input type="text" id="awayTeam" placeholder="Örn: Galatasaray">
    </div>

    <div class="form-group">
        <label>Maç Oranları (MS 1 / 0 / 2):</label>
        <input type="text" id="matchOdds" placeholder="Örn: 1.85 - 3.40 - 4.00">
    </div>

    <button onclick="calculate()">Analiz Yap</button>

    <div class="result" id="resultArea" style="display:none;">
        <h3>Sonuç</h3>
        <p id="outputText"></p>
    </div>
</div>

<script>
    function calculate() {
        const home = document.getElementById('homeTeam').value || "Ev Sahibi";
        const away = document.getElementById('awayTeam').value || "Deplasman";
        const odds = document.getElementById('matchOdds').value;
        const resultArea = document.getElementById('resultArea');
        const outputText = document.getElementById('outputText');

        resultArea.style.display = 'block';
        outputText.innerHTML = `<strong>${home} vs ${away}</strong> maçı için oranlar: ${odds}. Analiz işlemi gerçekleştirildi.`;
    }
</script>

</body>
</html>
